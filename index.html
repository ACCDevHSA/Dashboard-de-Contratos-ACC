<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard de Contratos - ACC</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
:root{--bg:#08111f;--surface:rgba(255,255,255,.08);--text:#eef6ff;--muted:#97a6ba;--line:rgba(255,255,255,.12);--primary:#5eead4;--primary2:#60a5fa;--warning:#fbbf24;--danger:#fb7185}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:Inter,Segoe UI,sans-serif;background:radial-gradient(circle at top left,rgba(96,165,250,.25),transparent 32rem),linear-gradient(135deg,#07111e,#0c1729 48%,#111827);min-height:100vh}.app{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}.side{position:sticky;top:0;height:100vh;overflow:auto;padding:16px 13px;background:rgba(8,17,31,.9);border-right:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center;margin-bottom:16px}.logo{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;color:#06111f;font-weight:900;background:linear-gradient(135deg,var(--primary),var(--primary2))}.brand h1,.brand p{margin:0}.brand h1{font-size:1.05rem}.muted,.brand p{color:var(--muted);font-size:.78rem}.nav{display:grid;gap:8px;margin:12px 0 16px}.nav button,.btn{border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);background:rgba(255,255,255,.07);font-weight:800;cursor:pointer;text-align:left}.nav button.active{color:#06111f;background:linear-gradient(135deg,var(--primary),var(--primary2))}.filters{display:grid;gap:7px;padding:13px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}label{color:var(--muted);font-size:.68rem;font-weight:800;text-transform:uppercase}input,select{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 9px;background:#182235;color:var(--text)}select option{background:#111827}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.actions .btn{text-align:center}.main{padding:20px;min-width:0}.top h2{font-size:clamp(1.8rem,3vw,2.8rem);margin:0}.top p{color:var(--muted);margin:7px 0 16px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.table-section{border:1px solid var(--line);background:var(--surface);border-radius:20px}.card{padding:17px;display:flex;justify-content:space-between;align-items:center}.card p,.card h3{margin:0}.card p{color:var(--muted);font-size:.82rem}.card h3{margin-top:8px;font-size:1.65rem}.table-section{padding:15px;margin-top:16px}.title{display:flex;justify-content:space-between;gap:14px;align-items:center;margin-bottom:12px}.title h3,.title p{margin:0}.title p{color:var(--muted);font-size:.78rem}.title span{color:var(--primary);font-weight:800}.wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;background:rgba(7,17,30,.55)}th,td{padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.08);font-size:.76rem;white-space:normal}th{text-align:center;background:#06435a;color:#fff;text-transform:uppercase;position:sticky;top:0}td{text-align:left}.pill{display:inline-flex;border-radius:999px;padding:4px 8px;font-weight:850;background:rgba(94,234,212,.13);color:#9cf7e8}.pill.pending{color:var(--warning)}.progress{min-width:90px;height:7px;border-radius:99px;background:rgba(255,255,255,.11);overflow:hidden;margin-top:5px}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2))}.error{padding:14px;border:1px solid var(--danger);border-radius:12px;color:#fecdd3;margin-bottom:14px}.hidden{display:none!important}@media(max-width:1000px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.kpis{grid-template-columns:1fr}.main{padding:10px}}
</style></head><body><div class="app"><aside class="side"><div class="brand"><div class="logo">BI</div><div><h1>Gestão de Contratos</h1><p>Contract management dashboard</p></div></div><label>Contract category</label><nav class="nav"><button data-tab="comodato" class="active">Contratos de Comodato</button><button data-tab="fornecimento">Contratos de Fornecimento</button><button data-tab="distrato">Distratos</button></nav><div class="filters"><strong>Filters</strong><label>Search</label><input id="search" type="search" placeholder="Number, supplier, project, status..."><label>Supplier</label><select id="supplier" multiple size="5"></select><div id="projectBlock"><label>Project</label><select id="project" multiple size="4"></select></div><label>Status</label><select id="status" multiple size="3"></select><label id="numberLabel">Agreement Number</label><select id="number" multiple size="4"></select><div class="actions"><button class="btn" id="clear">Clear</button><button class="btn" id="export">Export CSV</button></div></div></aside><main class="main"><header class="top"><h2>Gestão de Contratos</h2><p id="loadInfo">Loading contratos.json...</p></header><div id="error" class="error hidden"></div><h2 id="pageTitle">Contratos de Comodato</h2><section class="kpis"><div class="card"><div><p>Total records</p><h3 id="kpiRecords">0</h3></div><b>▤</b></div><div class="card"><div><p>Distinct contracts</p><h3 id="kpiContracts">0</h3></div><b>▣</b></div><div class="card"><div><p>Suppliers</p><h3 id="kpiSuppliers">0</h3></div><b>◆</b></div><div class="card"><div><p>Average progress</p><h3 id="kpiProgress">0%</h3></div><b>↗</b></div></section><section class="table-section"><div class="title"><div><h3>Analytical table</h3><p>Rows loaded from contratos.json</p></div><span id="tableCount"></span></div><div class="wrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></section></main></div>
<script>
const configs={comodato:{title:'Contratos de Comodato',number:'Tooling Loan Agreement ID',columns:['Project','Supplier','Tooling Loan Agreement ID','Total Agreement Value','Creation Date','Expiration Date','Renew in E-LAW','Custody Certificate Status','Sales Invoice Status','Tooling Loan Invoice Status','Supplier Validation','Agreement Invoice Signature Status','Tooling Loan Agreement Signature Status','General Status','Overall Progression'],project:true},fornecimento:{title:'Contratos de Fornecimento',number:'Contract Number',columns:['Supplier','Contract Number','Creation Date','Expiration Date','Renew in E-LAW','Supplier Validation','Contract Signature','General Status','Overall Progression'],project:false},distrato:{title:'Distratos',number:'Contract Termination Number',columns:['Supplier','Contract Termination Number','Creation Date','Expiration Date','Termination Date','Supplier Validation','Contract Termination Signature','General Status','Overall Progression'],project:false}};
const state={active:'comodato',data:{comodato:[],fornecimento:[],distrato:[]},filtered:[]},$=id=>document.getElementById(id),norm=v=>String(v??'').trim(),esc=v=>norm(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),selected=id=>[...$(id).selectedOptions].map(o=>o.value);
function pct(v){const n=Number(String(v??0).replace('%','').replace(',','.'));return Math.max(0,Math.min(100,Math.round(n<=1?n*100:n)))}function fmtDate(v){if(!v)return'-';const d=new Date(v);return isNaN(d)?esc(v):new Intl.DateTimeFormat('en-US').format(d)}
function populate(){const d=state.data[state.active],c=configs[state.active],fill=(id,col)=>$(id).innerHTML=[...new Set(d.map(r=>norm(r[col])).filter(Boolean))].sort().map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('');fill('supplier','Supplier');fill('status','General Status');fill('number',c.number);if(c.project)fill('project','Project')}
function apply(){const c=configs[state.active],q=norm($('search').value).toLowerCase(),su=selected('supplier'),st=selected('status'),nu=selected('number'),pr=c.project?selected('project'):[];state.filtered=state.data[state.active].filter(r=>{const hay=c.columns.map(x=>r[x]).join(' ').toLowerCase();return(!q||hay.includes(q))&&(!su.length||su.includes(norm(r.Supplier)))&&(!st.length||st.includes(norm(r['General Status'])))&&(!nu.length||nu.includes(norm(r[c.number])))&&(!pr.length||pr.includes(norm(r.Project)))});render()}
function render(){const c=configs[state.active],d=state.filtered,contracts=new Set(d.map(r=>norm(r[c.number])).filter(Boolean));$('kpiRecords').textContent=d.length;$('kpiContracts').textContent=contracts.size;$('kpiSuppliers').textContent=new Set(d.map(r=>norm(r.Supplier)).filter(Boolean)).size;$('kpiProgress').textContent=(d.length?Math.round(d.reduce((a,r)=>a+pct(r['Overall Progression']),0)/d.length):0)+'%';$('tableCount').textContent=`${d.length} rows • ${contracts.size} distinct contracts`;$('thead').innerHTML='<tr>'+c.columns.map(x=>`<th>${esc(x)}</th>`).join('')+'</tr>';$('tbody').innerHTML=d.length?d.map(r=>'<tr>'+c.columns.map(col=>{let v=r[col]??'-';if(col.includes('Date'))v=fmtDate(v);if(col==='Total Agreement Value')v=Number(r[col]||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});if(col==='Overall Progression')return`<td><strong>${pct(v)}%</strong><div class="progress"><i style="width:${pct(v)}%"></i></div></td>`;if(col.includes('Status')||col.includes('Validation')||col.includes('Signature'))return`<td><span class="pill ${norm(v).includes('PENDING')?'pending':''}">${esc(v)}</span></td>`;return`<td>${esc(v)}</td>`}).join('')+'</tr>').join(''):`<tr><td colspan="${c.columns.length}" style="text-align:center;padding:24px">No data found.</td></tr>`}
function clear(){['search'].forEach(id=>$(id).value='');['supplier','project','status','number'].forEach(id=>[...$(id).options].forEach(o=>o.selected=false));apply()}
function switchTab(tab){state.active=tab;const c=configs[tab];document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('pageTitle').textContent=c.title;$('numberLabel').textContent=c.number;$('projectBlock').classList.toggle('hidden',!c.project);populate();state.filtered=[...state.data[tab]];render();$('loadInfo').textContent=`${c.title} • ${state.data[tab].length} rows • data source: contratos.json`}
function exportCsv(){const c=configs[state.active],lines=[c.columns.join(';'),...state.filtered.map(r=>c.columns.map(col=>`"${String(r[col]??'').replace(/"/g,'""')}"`).join(';'))],a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'}));a.download=state.active+'-analytical-table.csv';a.click()}
async function loadData(){try{const response=await fetch('contratos.json?ts='+Date.now(),{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);const data=await response.json();for(const key of Object.keys(state.data)){if(!Array.isArray(data[key]))throw new Error(`A seção "${key}" não existe ou não é uma lista.`)}state.data=data;switchTab('comodato')}catch(e){$('error').classList.remove('hidden');$('error').innerHTML='<strong>Could not load contratos.json.</strong><br>'+esc(e.message)+'<br><small>Test this page through GitHub Pages or a local web server, not by double-clicking index.html.</small>';$('loadInfo').textContent='Data load failed';render()}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));['search','supplier','project','status','number'].forEach(id=>$(id).addEventListener('input',apply));$('clear').onclick=clear;$('export').onclick=exportCsv;window.addEventListener('load',loadData);
</script></body></html>
