<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Supplier Management</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --surface-2: #f5f6f8;
    --text: #1f2937;
    --text-soft: #778197;
    --line: #e5e7eb;
    --primary: #c8102e;
    --primary-soft: #fbe8eb;
    --primary-ink: #8f0f1b;

    --g-cad: #eef0fd;
    --g-ent: #e5f5ee;
    --g-pre: #fdf1e3;
    --g-vol: #e6f3fb;
    --g-qua: #f6e9f6;
    --g-war: #fbe9ec;
    --g-ovr: #e9e6f8;

    --good-bg: #dff3e7;  --good-ink: #2f7a52;
    --bad-bg:  #fbe1e1;  --bad-ink:  #a94a4a;
    --neutral-bg: #eeedf5; --neutral-ink: #6d6b80;

    --radius: 11px;
    --shadow-1: 0 1px 3px rgba(30, 36, 52, .08);
    --shadow-2: 0 4px 14px rgba(30, 36, 52, .12);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: Inter, "Segoe UI", Arial, sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  .muted { color: var(--text-soft); }

  /* ---------- Top (header + tabs) ---------- */
  .top { position: sticky; top: 0; z-index: 30; background: var(--surface); box-shadow: var(--shadow-1); }
  .appbar { display: flex; align-items: center; gap: 14px; padding: 16px 32px 6px; }
  .logo { width: 40px; height: 40px; border-radius: 12px; background: var(--primary-soft); color: var(--primary-ink); display: grid; place-items: center; }
  .appbar h1 { font-size: 20px; font-weight: 500; margin: 0; letter-spacing: .2px; }

  .tabs { display: flex; gap: 4px; padding: 0 24px; overflow-x: auto; }
  .tab {
    display: inline-flex; align-items: center; gap: 8px; position: relative;
    height: 46px; padding: 0 18px; border: none; background: transparent; cursor: pointer;
    font: inherit; font-weight: 500; letter-spacing: .3px; color: var(--text-soft);
    border-radius: 12px 12px 0 0; transition: background .2s, color .2s; white-space: nowrap;
  }
  .tab:hover { background: var(--bg); }
  .tab.active { color: var(--primary-ink); }
  .tab.active::after { content: ""; position: absolute; left: 14px; right: 14px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--primary); }

  /* ---------- Buttons / toolbar ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 18px; border: none; cursor: pointer;
    border-radius: 999px; font: inherit; font-weight: 500; letter-spacing: .3px;
    transition: box-shadow .2s, background .2s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--primary-soft); color: var(--primary-ink); box-shadow: var(--shadow-1); }
  .btn-primary:hover { box-shadow: var(--shadow-2); background: #dde1fb; }
  .btn-ghost { background: transparent; color: var(--text-soft); }
  .btn-ghost:hover { background: var(--bg); }
  .btn-danger { background: var(--bad-bg); color: var(--bad-ink); }
  .btn-danger:hover { background: #f6d2d2; }
  .btn-tonal { background: var(--bg); color: var(--text); }
  .btn-tonal:hover { background: var(--line); }

  main { padding: 24px 32px 56px; max-width: 1800px; margin: 0 auto; }
  .toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .toolbar .spacer { flex: 1; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--surface); border-radius: 999px; padding: 0 16px; height: 40px; min-width: 280px; color: var(--text-soft); box-shadow: var(--shadow-1); transition: box-shadow .2s; }
  .search:focus-within { box-shadow: 0 0 0 2px var(--primary); }
  .search input { border: none; background: transparent; outline: none; font: inherit; color: var(--text); width: 100%; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .fchip {
    border: 1px solid var(--line); background: var(--surface); color: var(--text-soft); cursor: pointer;
    height: 34px; padding: 0 14px; border-radius: 999px; font: inherit; font-weight: 500; display: inline-flex; align-items: center; gap: 8px;
    transition: background .2s, color .2s, border-color .2s;
  }
  .fchip:hover { background: var(--bg); }
  .fchip.on { background: var(--primary-soft); color: var(--primary-ink); border-color: transparent; }
  .fchip .n { font-size: 11px; background: var(--bg); border-radius: 999px; padding: 1px 7px; }
  .fchip.on .n { background: #fff; }

  /* ---------- Cards / panels ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 16px; margin-bottom: 20px; }
  .card { background: var(--surface); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow-1); display: flex; align-items: center; gap: 14px; }
  .card .ico { width: 44px; height: 44px; border-radius: 14px; display: grid; place-items: center; flex: none; }
  .card .lbl { font-size: 12px; color: var(--text-soft); }
  .card .val { font-size: 22px; font-weight: 500; margin-top: 2px; }
  .card .sub { font-size: 11px; color: var(--text-soft); margin-top: 2px; }
  .i1 { background: var(--g-cad); color: var(--primary-ink); }
  .i2 { background: var(--g-ent); color: #3b8f67; }
  .i3 { background: var(--g-pre); color: #b57a2a; }
  .i4 { background: var(--g-vol); color: #3a7fa8; }
  .i5 { background: var(--g-qua); color: #9a58a0; }
  .i6 { background: var(--g-war); color: #b85a6a; }

  .grid { display: grid; gap: 16px; margin-bottom: 16px; }
  .g-2-1 { grid-template-columns: 2fr 1fr; }
  .g-auto { grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); }
  .g-1-1 { grid-template-columns: 1fr 1fr; }
  @media (max-width: 1000px) { .g-2-1, .g-1-1 { grid-template-columns: 1fr; } .g-auto { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow-1); min-width: 0; }
  .panel h3 { margin: 0 0 4px; font-size: 15px; font-weight: 500; }
  .panel .desc { margin: 0 0 16px; font-size: 12px; color: var(--text-soft); }
  .legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--text-soft); margin-bottom: 12px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

  /* ---------- Tier / score / rating badges ---------- */
  .tier { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; }
  .tier i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .7; }
  .score { display: inline-block; min-width: 38px; text-align: center; padding: 3px 10px; border-radius: 999px; font-weight: 500; font-size: 12.5px; }
  .rchip { display: inline-block; padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 500; }
  .r1 { background: #f8d9d9; color: #a04545; }
  .r2 { background: #fbe4d0; color: #a6652a; }
  .r3 { background: #fbf0c8; color: #8d7314; }
  .r4 { background: #e2f2d6; color: #4a7a2c; }
  .r5 { background: #d3f0e1; color: #2a7a55; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .chip.good { background: var(--good-bg); color: var(--good-ink); }
  .chip.bad  { background: var(--bad-bg);  color: var(--bad-ink); }
  .chip.neutral { background: var(--neutral-bg); color: var(--neutral-ink); }

  /* ---------- Dashboard charts ---------- */
  .lb-row { display: grid; grid-template-columns: 26px minmax(120px, 1.1fr) 1.4fr 36px 108px; gap: 12px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .lb-row:last-child { border-bottom: none; }
  .rank { width: 26px; height: 26px; border-radius: 50%; background: var(--bg); color: var(--text-soft); display: grid; place-items: center; font-size: 12px; font-weight: 500; }
  .lb-name b { font-weight: 500; display: block; }
  .lb-name small { color: var(--text-soft); font-size: 11px; }
  .track { height: 10px; background: var(--bg); border-radius: 999px; overflow: hidden; position: relative; }
  .track > i { display: block; height: 100%; border-radius: 999px; }
  .lb-score { font-weight: 500; text-align: right; }
  .funnel { display:flex; flex-direction:column; align-items:center; gap:5px; padding:2px 0; }
  .funnel-row { min-height:36px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:6px 11px; border-radius:10px; color:var(--text); transition:transform .2s; }
  .funnel-row:hover { transform:translateY(-1px); }
  .funnel-main { display:flex; align-items:center; gap:10px; min-width:0; }
  .funnel-rank { width:24px; height:24px; display:grid; place-items:center; border-radius:50%; background:rgba(255,255,255,.75); font-size:11px; font-weight:600; }
  .funnel-name { min-width:0; } .funnel-name b { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
  .funnel-score { font-size:15px; font-weight:600; white-space:nowrap; }
  .new-badge { display:inline-flex; align-items:center; margin-left:7px; padding:2px 6px; border-radius:999px; background:#d9f1e2; color:#28734e; font-size:10px; font-weight:700; letter-spacing:.5px; vertical-align:middle; }

  .donut-wrap { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .donut-legend { display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
  .donut-legend div { display: flex; align-items: center; gap: 10px; }
  .donut-legend i { width: 12px; height: 12px; border-radius: 4px; }
  .donut-legend b { margin-left: auto; padding-left: 18px; font-weight: 500; }

  table.heat { width: 100%; border-collapse: separate; border-spacing: 4px; min-width: 520px; }
  table.heat th { font-size: 11px; font-weight: 500; color: var(--text-soft); text-align: center; padding: 4px; text-transform: uppercase; letter-spacing: .4px; }
  table.heat th:first-child, table.heat td:first-child { text-align: left; }
  table.heat td { text-align: center; padding: 7px 6px; border-radius: 8px; font-weight: 500; font-size: 12.5px; }
  table.heat td:first-child { background: transparent; font-weight: 500; padding-left: 2px; white-space: nowrap; }
  .heat-wrap { overflow-x: auto; }

  .brow { display: grid; grid-template-columns: 120px 1fr 74px; gap: 12px; align-items: center; padding: 6px 0; }
  .brow .bl { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brow .bv { font-size: 12px; text-align: right; color: var(--text-soft); white-space: nowrap; }
  .stack { display: flex; flex-direction: column; gap: 4px; }
  .bar { height: 9px; border-radius: 999px; }
  .div-track { position: relative; height: 12px; background: var(--bg); border-radius: 999px; }
  .div-track .zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 2px; background: #cfcbe0; border-radius: 2px; }
  .div-track .seg { position: absolute; top: 0; bottom: 0; }
  .div-track .seg.pos { left: 50%; border-radius: 0 999px 999px 0; }
  .div-track .seg.neg { right: 50%; border-radius: 999px 0 0 999px; }
  .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #9d99b8; border-radius: 2px; }

  .radar-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .radar-chips .fchip { height: 28px; padding: 0 12px; font-size: 12px; }
  .radar-legend { display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; font-size: 12px; margin-top: 4px; }
  .radar-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; }

  .empty { padding: 56px 16px; text-align: center; color: var(--text-soft); }

  /* ---------- Suppliers table ---------- */
  .table-wrap { background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow-1); overflow: auto; max-height: calc(100vh - 250px); min-height: 320px; }
  table.data { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 3300px; }
  table.data thead th { position: sticky; background: var(--surface); z-index: 5; }
  table.data thead tr.groups th { top: 0; height: 40px; font-size: 12px; font-weight: 500; letter-spacing: .6px; text-transform: uppercase; text-align: center; }
  table.data thead tr.cols th { top: 40px; height: 44px; font-size: 12px; font-weight: 500; color: var(--text-soft); text-align: left; padding: 0 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th.g-cad { background: var(--g-cad) !important; color: var(--primary-ink) !important; }
  th.g-ent { background: var(--g-ent) !important; color: #3b8f67 !important; }
  th.g-pre { background: var(--g-pre) !important; color: #b57a2a !important; }
  th.g-vol { background: var(--g-vol) !important; color: #3a7fa8 !important; }
  th.g-qua { background: var(--g-qua) !important; color: #9a58a0 !important; }
  th.g-war { background: var(--g-war) !important; color: #b85a6a !important; }
  th.g-ovr { background: var(--g-ovr) !important; color: var(--primary-ink) !important; }
  th.g-none { background: var(--surface) !important; }

  table.data tbody td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; background: var(--surface); }
  table.data tbody tr:hover td { background: var(--surface-2); }
  table.data tbody tr.editing td { background: #f4f5fe; }
  table.data tbody tr:last-child td { border-bottom: none; }
  td.num, th.num { text-align: right; }
  td.sub, .sub { color: var(--text-soft); }
  td .sub { font-size: 12px; }

  .sl1, .sl2 { position: sticky; z-index: 4; }
  .sl1 { left: 0; width: 124px; min-width: 124px; max-width: 124px; }
  .sl2 { left: 124px; width: 220px; min-width: 220px; max-width: 220px; box-shadow: 6px 0 8px -8px rgba(80,70,120,.25); overflow: hidden; text-overflow: ellipsis; }
  table.data thead th.sl1, table.data thead th.sl2 { z-index: 7; }
  .sticky-r { position: sticky; right: 0; z-index: 4; box-shadow: -6px 0 8px -8px rgba(80,70,120,.25); }
  table.data thead th.sticky-r { z-index: 7; }

  .sid { display: inline-block; padding: 4px 10px; border-radius: 8px; background: var(--primary-soft); color: var(--primary-ink); font-weight: 500; font-size: 12px; letter-spacing: .4px; }
  .name { font-weight: 500; }
  a.contract { display: inline-flex; align-items: center; gap: 6px; color: var(--primary-ink); text-decoration: none; font-weight: 500; padding: 4px 10px; border-radius: 8px; background: var(--g-cad); transition: background .2s; }
  a.contract:hover { background: var(--primary-soft); }
  span.contract-nolink { color: var(--text); font-weight: 500; padding: 4px 10px; border-radius: 8px; background: var(--neutral-bg); }

  td input, td select { font: inherit; color: var(--text); border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 10px; width: 100%; min-width: 80px; outline: none; transition: border-color .2s, box-shadow .2s; }
  td input:focus, td select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(142,154,234,.2); }
  td input[type=number] { text-align: right; }
  td.sl1 input { min-width: 0; }
  td.sl2 input { min-width: 0; }
  .w-md { min-width: 150px; } .w-lg { min-width: 200px; }
  .vstack { display: flex; flex-direction: column; gap: 6px; }

  .actions { display: flex; gap: 4px; justify-content: center; }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer; background: transparent; color: var(--text-soft); display: grid; place-items: center; transition: background .2s, color .2s; }
  .icon-btn:hover { background: var(--primary-soft); color: var(--primary-ink); }
  .icon-btn.save { background: var(--good-bg); color: var(--good-ink); }
  .icon-btn.save:hover { background: #cdeadb; }
  .icon-btn.cancel:hover, .icon-btn.del:hover { background: var(--bad-bg); color: var(--bad-ink); }

  .hint { margin-top: 14px; font-size: 12px; color: var(--text-soft); display: flex; gap: 18px; flex-wrap: wrap; }
  .hint b { font-weight: 500; }

  /* ---------- Settings ---------- */
  .form-table { width: 100%; border-collapse: collapse; }
  .form-table th { text-align: left; font-size: 12px; font-weight: 500; color: var(--text-soft); padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); }
  .form-table td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .form-table td.rule { color: var(--text-soft); font-size: 12px; }
  .form-table tfoot td { border-bottom: none; font-weight: 500; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12px; color: var(--text-soft); }
  .field input, .num-in { font: inherit; color: var(--text); border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; width: 100%; max-width: 120px; outline: none; text-align: right; }
  .field input:focus, .num-in:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(142,154,234,.2); }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; margin: 18px 0; }
  .sec-title { font-size: 12px; font-weight: 500; letter-spacing: .6px; text-transform: uppercase; color: var(--text-soft); margin: 22px 0 0; }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
  pre.code { background: #f4f3fa; border-radius: 12px; padding: 14px 16px; font-size: 12px; line-height: 1.55; overflow: auto; max-height: 300px; margin: 8px 0 0; color: #45435a; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 14px; font-size: 13px; margin: 8px 0 4px; }
  .kv dt { color: var(--text-soft); } .kv dd { margin: 0; }
  .scale { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .rfq-tree { display:flex; flex-direction:column; gap:12px; }
  .rfq-supplier { border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--surface); }
  .rfq-supplier summary { cursor:pointer; list-style:none; display:flex; align-items:center; gap:10px; padding:15px 16px; font-weight:500; }
  .rfq-supplier summary::-webkit-details-marker { display:none; }
  .rfq-supplier summary::before { content:'›'; color:var(--primary-ink); font-size:20px; transform:rotate(0); transition:transform .2s; }
  .rfq-supplier[open] summary::before { transform:rotate(90deg); }
  .rfq-project { margin:0 14px 14px; border-radius:10px; overflow:auto; border:1px solid var(--line); }
  .rfq-project h4 { margin:0; padding:11px 13px; background:var(--g-cad); color:var(--primary-ink); font-size:12px; letter-spacing:.3px; }
  .rfq-table { width:100%; min-width:850px; border-collapse:collapse; font-size:12px; }
  .rfq-table th { padding:10px 12px; text-align:left; color:var(--text-soft); font-weight:500; background:var(--surface-2); white-space:nowrap; }
  .rfq-table td { padding:11px 12px; border-top:1px solid var(--line); white-space:nowrap; }

  .toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); background: #4a4960; color: #fff; padding: 12px 20px; border-radius: 12px; opacity: 0; pointer-events: none; transition: all .25s; box-shadow: var(--shadow-2); z-index: 50; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (max-width: 800px) {
    .appbar { padding: 14px 16px 4px; } .tabs { padding: 0 8px; }
    main { padding: 16px; } .search { min-width: 0; flex: 1; }
    .lb-row { grid-template-columns: 24px 1fr 36px; } .lb-row .track, .lb-row .tier { display: none; }
  }

  /* General View is read-only and omits registration-only columns. */
  table.general-view th:nth-child(3), table.general-view td:nth-child(3),
  table.general-view th:nth-child(4), table.general-view td:nth-child(4) { display: none; }
  table.general-view [data-act="edit"], table.general-view [data-act="del"] { display: none; }
  table.general-view th:last-child, table.general-view td:last-child { display: none; }



  .logo{overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:50%;padding:3px}
  .logo img{display:block;width:100%;height:100%;object-fit:contain;border-radius:50%}
  .top{background:#fff;border-bottom:1px solid var(--line);box-shadow:var(--shadow-1)}
  .appbar{padding-top:14px}
  .appbar h1{font-weight:700;color:#1f2937}
  .tab{color:#778197;font-weight:700;border-radius:8px 8px 0 0}
  .tab:hover{background:#f5f6f8;color:#272d3e}
  .tab.active{color:#8f0f1b;background:#fbe8eb}
  .tab.active:after{background:#c8102e}
  .btn-primary{background:#272d3e!important;color:#fff!important;border-color:#272d3e!important}
  .panel{border:1px solid var(--line)}

  .contract-frame-panel{padding:0;overflow:hidden;height:calc(100vh - 118px);min-height:680px;margin:0;border:0;border-radius:0;box-shadow:none;background:transparent}
  .contract-frame{display:block;width:100%;height:100%;border:0;background:#fff}

  table.supplier-registration{table-layout:auto;min-width:max-content;width:100%}
  table.supplier-registration thead th,
  table.supplier-registration tbody td{box-sizing:border-box;padding-left:12px;padding-right:12px;text-align:left;vertical-align:middle}
  table.supplier-registration thead th:last-child,

/* =====================================================================

const $  = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const isNum = v => typeof v === 'number' && isFinite(v);
const clamp = (v, lo = 0, hi = 100) => Math.min(hi, Math.max(lo, v));
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const sum  = a => a.reduce((s, x) => s + x, 0);
const toNum = v => { if (v === null || v === undefined || v === '') return null; const n = Number(v); return isFinite(n) ? n : null; };
const uid = () => 'rec-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const clone = o => JSON.parse(JSON.stringify(o));

const fmt = {
  int:   n => isNum(n) ? n.toLocaleString(APP_CONFIG.locale, { maximumFractionDigits: 1 }) : '—',
  money: n => isNum(n) ? n.toLocaleString(APP_CONFIG.locale, { style: 'currency', currency: APP_CONFIG.currency }) : '—',
  days:  n => isNum(n) ? fmt.int(n) + ' d' : '—',

function safeUrl(u) {
  u = (u || '').trim(); if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : ''; } catch { return ''; }
}

/* Normalises any raw object (API, import, form) into the record schema. */
function normalizeRecord(raw) {
  raw = raw || {};
  const rt = raw.ratings || {};
  const rating = v => { const n = toNum(v); return n && n >= 1 && n <= 5 ? Math.round(n) : null; };
  return {
    id: raw.id || uid(),
    supplierId: String(raw.supplierId ?? '').trim().replace(/^FOR-/i, 'SUP-'),
    createdAt: raw.createdAt || '2025-01-01T00:00:00.000Z',
    name: String(raw.name ?? '').trim(),
    taxId: String(raw.taxId ?? '').trim(),
    contactName: String(raw.contactName ?? '').trim(),
    contactInfo: String(raw.contactInfo ?? '').trim(),
    contractId: String(raw.contractId ?? '').trim(),
    contractUrl: String(raw.contractUrl ?? '').trim(),
    leadAgreed: toNum(raw.leadAgreed), leadActual: toNum(raw.leadActual),
    priceAgreed: toNum(raw.priceAgreed), priceActual: toNum(raw.priceActual),
    volAgreed: toNum(raw.volAgreed), volActual: toNum(raw.volActual),
    warrantyCases: toNum(raw.warrantyCases),
    ratings: Object.fromEntries(CRITERIA.map(c => [c.key, rating(rt[c.key])]))
  };
}
function normalizeSettings(raw) {
  const d = clone(DEFAULT_SETTINGS); raw = raw || {};
  const n = (v, fb) => isNum(toNum(v)) ? toNum(v) : fb;
  CRITERIA.forEach(c => d.weights[c.key] = Math.max(0, n(raw.weights && raw.weights[c.key], d.weights[c.key])));
  ['gold', 'silver', 'bronze'].forEach(k => d.tiers[k] = clamp(n(raw.tiers && raw.tiers[k], d.tiers[k])));
  d.manualInfluence = clamp(n(raw.manualInfluence, d.manualInfluence));
  Object.keys(d.penalties).forEach(k => d.penalties[k] = Math.max(0, n(raw.penalties && raw.penalties[k], d.penalties[k])));
  return d;
}

/* =====================================================================
   5. DATA LAYER  —  every adapter exposes the same async interface,
      so swapping demo data for a real backend never touches the UI.
   ===================================================================== */
class LocalAdapter {
  constructor() { this.rk = 'supplier-management:records:v2'; this.sk = 'supplier-management:settings:v2'; this.mem = {}; }
  _get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return this.mem[k] ? JSON.parse(this.mem[k]) : null; } }
  _set(k, v) { const s = JSON.stringify(v); try { localStorage.setItem(k, s); } catch (e) { this.mem[k] = s; } }
  async list() {
    let rows = this._get(this.rk);
    if (!rows) { rows = SEED.map(normalizeRecord); this._set(this.rk, rows); }
    return rows.map(normalizeRecord);
  }
  async create(rec) { const rows = await this.list(); const r = { ...rec, id: uid() }; rows.push(r); this._set(this.rk, rows); return r; }
  async update(id, rec) { const rows = await this.list(); const i = rows.findIndex(r => r.id === id); if (i < 0) throw new Error('Record not found'); rows[i] = { ...rec, id }; this._set(this.rk, rows); return rows[i]; }
  async remove(id) { this._set(this.rk, (await this.list()).filter(r => r.id !== id)); }
  async replaceAll(rows) { const out = rows.map(normalizeRecord); this._set(this.rk, out); return out; }
  async getSettings() { return this._get(this.sk); }
  async saveSettings(s) { this._set(this.sk, s); return s; }
}

/* Expected REST contract (adjust paths / field names in fromApi & toApi):
     GET    {base}/supplier-records            → [record, …]
     POST   {base}/supplier-records            ← record      → record (with id)
     PUT    {base}/supplier-records/:id        ← record      → record
     DELETE {base}/supplier-records/:id
     PUT    {base}/supplier-records            ← [record, …] (bulk replace, used by import)
     GET    {base}/scoring-settings            → settings
     PUT    {base}/scoring-settings            ← settings                                  */
class RestAdapter {
  constructor(cfg) { this.base = String(cfg.baseUrl || '').replace(/\/$/, ''); this.headers = cfg.headers || {}; }
  fromApi(row) { return normalizeRecord(row); }      // ← map your real field names here
  toApi(rec)   { return rec; }                        // ← and back here
  async _req(method, path, body) {
    const res = await fetch(this.base + path, {
      method, headers: Object.assign({ 'Content-Type': 'application/json' }, this.headers),
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    if (!res.ok) throw new Error(method + ' ' + path + ' → ' + res.status);
    return res.status === 204 ? null : res.json();
  }
  async list()          { return (await this._req('GET', '/supplier-records')).map(r => this.fromApi(r)); }
  async create(rec)     { return this.fromApi(await this._req('POST', '/supplier-records', this.toApi(rec))); }
  async update(id, rec) { return this.fromApi(await this._req('PUT', '/supplier-records/' + encodeURIComponent(id), this.toApi(rec))); }
  async remove(id)      { await this._req('DELETE', '/supplier-records/' + encodeURIComponent(id)); }
  async replaceAll(rows){ return (await this._req('PUT', '/supplier-records', rows.map(r => this.toApi(r)))).map(r => this.fromApi(r)); }
  async getSettings()   { try { return await this._req('GET', '/scoring-settings'); } catch (e) { return null; } }
  async saveSettings(s) { return this._req('PUT', '/scoring-settings', s); }
}

class SupabaseAdapter {
  constructor(cfg) {
    if (!window.supabase?.createClient) throw new Error('Supabase SDK not loaded');
    if (!cfg?.url || !cfg?.publishableKey) throw new Error('Supabase URL or publishable key missing');
    this.client = window.supabase.createClient(cfg.url, cfg.publishableKey);
    window.supplierSupabaseClient = this.client;
    this.local = new LocalAdapter();
  }
  fromDb(row) {
    return normalizeRecord({
      id: row.supplier_id,
      supplierId: row.supplier_id,
      sapId: row.sap_id,
      jdeId: row.jde_id,
      fantasyName: row.fantasy_name,
      name: row.legal_name,
      taxId: row.tax_id,
      contactName: row.contact_name,
      contactInfo: row.contact_info || row.email || '',
      address: row.address,
      city: row.city,
      milkRun: row.milk_run,
      status: row.status,
      createdAt: row.created_at
    });
  }
  toDb(rec) {
    const r=normalizeRecord(rec);
    const email=(String(r.contactInfo||'').match(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/i)||[''])[0];
    return {
      supplier_id:r.supplierId,
      sap_id:r.sapId || null,
      jde_id:r.jdeId || null,
      fantasy_name:r.fantasyName || null,
      legal_name:r.name,
      tax_id:r.taxId || null,
      contact_name:r.contactName || null,
      email:email || null,
      contact_info:r.contactInfo || null,
      address:r.address || null,
      city:r.city || null,
      milk_run:r.milkRun || 'No',
      status:r.status || 'Active'
    };
  }
  async list() {
    const {data,error}=await this.client.from('suppliers').select('*').order('supplier_id',{ascending:true});
    if(error) throw error;
    return (data||[]).map(row=>this.fromDb(row));
  }
  async create(rec) {
    const payload=this.toDb(rec);
    const {data,error}=await this.client.from('suppliers').insert(payload).select().single();
    if(error) throw error;
    return this.fromDb(data);
  }
  async update(id,rec) {
    const payload=this.toDb(rec);
    const oldId=String(id||'');
    const newId=payload.supplier_id;
    const {data,error}=await this.client.from('suppliers').update(payload).eq('supplier_id',oldId).select().single();
    if(error) throw error;
    return this.fromDb(data);
  }
  async remove(id) {
    const {error}=await this.client.from('suppliers').delete().eq('supplier_id',String(id));
    if(error) throw error;
  }
  async replaceAll(rows) {
    const {error:deleteError}=await this.client.from('suppliers').delete().neq('supplier_id','');
    if(deleteError) throw deleteError;
    if(!rows.length) return [];
    const {data,error}=await this.client.from('suppliers').insert(rows.map(r=>this.toDb(r))).select();
    if(error) throw error;
    return (data||[]).map(r=>this.fromDb(r));
  }
  async getSettings(){ return this.local.getSettings(); }
  async saveSettings(settings){ return this.local.saveSettings(settings); }

/* =====================================================================
   6. SCORING ENGINE  —  pure functions, no DOM, no storage.
   ===================================================================== */
const Scoring = {
  /* Objective 0-100 score computed from agreed vs actual data (null if not computable). */
  auto(r, s) {
    const p = s.penalties, out = { leadTime: null, price: null, volume: null, negotiation: null, warranty: null };
    if (isNum(r.leadAgreed) && r.leadAgreed > 0 && isNum(r.leadActual)) {
      const late = Math.max(0, (r.leadActual - r.leadAgreed) / r.leadAgreed * 100);
      out.leadTime = clamp(100 - late * p.leadTimePerPct);
    }
    if (isNum(r.priceAgreed) && r.priceAgreed > 0 && isNum(r.priceActual)) {
      const over = Math.max(0, (r.priceActual - r.priceAgreed) / r.priceAgreed * 100);
      out.price = clamp(100 - over * p.pricePerPct);
    }
    if (isNum(r.volAgreed) && r.volAgreed > 0 && isNum(r.volActual)) {
      out.volume = clamp(r.volActual / r.volAgreed * 100);
    }
    if (isNum(r.warrantyCases)) {
      if (isNum(r.volActual) && r.volActual > 0) out.warranty = clamp(100 - (r.warrantyCases / r.volActual * 1000) * p.warrantyPerThousand);
      else if (r.warrantyCases === 0) out.warranty = 100;
    }
    return out;
  },
  /* Final criterion score = auto score blended with the buyer rating. */
  blend(auto, rating, infl) {
    const manual = rating ? RATING_POINTS(rating) : null;
    if (isNum(auto) && isNum(manual)) return auto * (1 - infl / 100) + manual * infl / 100;
    return isNum(auto) ? auto : manual;
  },
  /* Weighted overall; criteria without a score are skipped and weights re-normalised. */
  combine(scores, weights) {
    let sw = 0, sm = 0;
    CRITERIA.forEach(c => { const v = scores[c.key], w = weights[c.key] || 0; if (isNum(v) && w > 0) { sw += w; sm += v * w; } });
    return sw ? sm / sw : null;
  },
  tier(overall, s) {
    if (!isNum(overall)) return 'none';
    if (overall >= s.tiers.gold) return 'gold';
    if (overall >= s.tiers.silver) return 'silver';
    if (overall >= s.tiers.bronze) return 'bronze';
    return 'review';
  },
  score(r, s) {
    const auto = this.auto(r, s), criteria = {}, finals = {};
    CRITERIA.forEach(c => {
      const manual = r.ratings && r.ratings[c.key] ? RATING_POINTS(r.ratings[c.key]) : null;
      const score = this.blend(auto[c.key], r.ratings && r.ratings[c.key], s.manualInfluence);
      criteria[c.key] = { auto: auto[c.key], manual, score }; finals[c.key] = score;
    });
    const overall = this.combine(finals, s.weights);
    return { criteria, overall, tier: this.tier(overall, s) };
  },
  /* Group records by supplierId → one comparable row per supplier. */
  aggregate(records, s) {
    const groups = new Map();
    records.forEach(r => { if (!r.supplierId) return; if (!groups.has(r.supplierId)) groups.set(r.supplierId, []); groups.get(r.supplierId).push(r); });
    return Array.from(groups, ([supplierId, rs]) => {
      const scored = rs.map(r => this.score(r, s));
      const crit = {};
      CRITERIA.forEach(c => { const v = scored.map(x => x.criteria[c.key].score).filter(isNum); crit[c.key] = v.length ? mean(v) : null; });
      const overall = this.combine(crit, s.weights);
      const both = (a, b) => rs.filter(r => isNum(r[a]) && isNum(r[b]));
      const lt = both('leadAgreed', 'leadActual'), pr = both('priceAgreed', 'priceActual'), vl = both('volAgreed', 'volActual');
      const volActualSum = sum(rs.filter(r => isNum(r.volActual)).map(r => r.volActual));
      const cases = sum(rs.filter(r => isNum(r.warrantyCases)).map(r => r.warrantyCases));
      return {
        supplierId, name: rs[0].name || supplierId, contracts: rs.length,
        criteria: crit, overall, tier: this.tier(overall, s),
        leadAgreedAvg: lt.length ? mean(lt.map(r => r.leadAgreed)) : null,
        leadActualAvg: lt.length ? mean(lt.map(r => r.leadActual)) : null,
        onTime: lt.filter(r => r.leadActual <= r.leadAgreed).length, onTimeBase: lt.length,
        priceVarPct: pr.length ? mean(pr.filter(r => r.priceAgreed > 0).map(r => (r.priceActual - r.priceAgreed) / r.priceAgreed * 100)) : null,
        fillRate: vl.length && sum(vl.map(r => r.volAgreed)) > 0 ? sum(vl.map(r => r.volActual)) / sum(vl.map(r => r.volAgreed)) * 100 : null,
        volAgreedSum: sum(vl.map(r => r.volAgreed)), volActualSum: sum(vl.map(r => r.volActual)),
        warrantyCases: cases, warrantyRate: volActualSum > 0 ? cases / volActualSum * 1000 : null
      };
    }).sort((a, b) => (b.overall ?? -1) - (a.overall ?? -1));
  }
};

/* kind: 'lt' | 'pr' | 'vl' */
function diffChip(kind, ac, re) {
  if (!isNum(ac) || !isNum(re)) return '<span class="muted">—</span>';
  const d = re - ac;
  if (d === 0) return '<span class="chip neutral">0</span>';
  const bad = kind === 'vl' ? d < 0 : d > 0, sign = d > 0 ? '+' : '−', abs = Math.abs(d);
  const pct = ac ? ` (${sign}${Math.abs(d / ac * 100).toFixed(1)}%)` : '';
  const txt = kind === 'lt' ? `${sign}${fmt.int(abs)} d` : kind === 'pr' ? `${sign}${fmt.money(abs)}${pct}` : `${sign}${fmt.int(abs)}${pct}`;
  return `<span class="chip ${bad ? 'bad' : 'good'}">${txt}</span>`;
}

function donut(counts) {
  const keys = ['gold', 'silver', 'bronze', 'review', 'none'].filter(k => counts[k] > 0);
  const total = sum(keys.map(k => counts[k])), r = 62, C = 2 * Math.PI * r;
  let off = 0;
  const segs = keys.map(k => {
    const len = counts[k] / total * C;
    const s = `<circle cx="80" cy="80" r="${r}" fill="none" stroke="${TIERS[k].bar}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 80 80)"/>`;
    off += len; return s;
  }).join('');
  return `<div class="donut-wrap">
    <svg width="170" height="170" viewBox="0 0 160 160">
      <circle cx="80" cy="80" r="${r}" fill="none" stroke="#f0eef7" stroke-width="22"/>${segs}
      <text x="80" y="82" text-anchor="middle" font-size="28" font-weight="500" fill="#3b3a4a">${total}</text>
      <text x="80" y="100" text-anchor="middle" font-size="11" fill="#7d7b8f">suppliers</text>
    </svg>
    <div class="donut-legend">${['gold', 'silver', 'bronze', 'review', 'none'].filter(k => counts[k] > 0 || k !== 'none').map(k => `<div><i style="background:${TIERS[k].bar}"></i>${TIERS[k].label}<b>${counts[k] || 0}</b></div>`).join('')}</div>
  </div>`;
}

const RADAR_COLORS = ['#8e9aea', '#ee9c9c', '#6fc39c', '#efbf5f'];
function radar(sel) {
  const cx = 180, cy = 158, R = 104, n = CRITERIA.length;
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / n;
  const pt = (i, v) => [cx + R * v / 100 * Math.cos(ang(i)), cy + R * v / 100 * Math.sin(ang(i))];
  const poly = vals => vals.map((v, i) => pt(i, v).map(x => x.toFixed(1)).join(',')).join(' ');
  let g = [20, 40, 60, 80, 100].map(v => `<polygon points="${poly(CRITERIA.map(() => v))}" fill="${v === 100 ? '#faf9fd' : 'none'}" stroke="#e6e3f0"/>`).join('');
  g += CRITERIA.map((c, i) => {
    const [x, y] = pt(i, 100), [lx, ly] = [cx + (R + 18) * Math.cos(ang(i)), cy + (R + 18) * Math.sin(ang(i))];
    const cos = Math.cos(ang(i)), anchor = cos > 0.3 ? 'start' : cos < -0.3 ? 'end' : 'middle';
    return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#e6e3f0"/><text x="${lx.toFixed(1)}" y="${(ly + 4).toFixed(1)}" text-anchor="${anchor}" font-size="11.5" fill="#7d7b8f">${c.label}</text>`;
  }).join('');
  g += sel.map((s, k) => {
    const vals = CRITERIA.map(c => s.criteria[c.key] ?? 0), col = RADAR_COLORS[k % RADAR_COLORS.length];
    return `<polygon points="${poly(vals)}" fill="${col}" fill-opacity=".22" stroke="${col}" stroke-width="2"/>` +
      vals.map((v, i) => { const [x, y] = pt(i, v); return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${col}"/>`; }).join('');
  }).join('');
  return `<svg viewBox="0 0 360 316" width="100%" style="max-width:420px;display:block;margin:0 auto">${g}</svg>`;
}

function renderDashboard() {
  const S = state.settings;
  // Supplier Registration is the dashboard master list. Supplier ID is the only pivot key.
  const supplierRegistrationById = new Map();
  state.records.map(normalizeRecord).forEach(record => {
    const supplierId=String(record.supplierId||'').trim();
    if(!supplierId) return;
    const current=supplierRegistrationById.get(supplierId);
    if(!current || (!current.fantasyName && record.fantasyName)) supplierRegistrationById.set(supplierId,record);
  });
  // Scan Financial Assessment using the same Supplier ID and use its Overall Status as the first BI department score.
  const financialScoreByStatus = {
    'Meets Without Restrictions': { score:100, label:'Excellent', tier:'gold' },
    'Meets': { score:75, label:'Good', tier:'silver' },
    'Meets With Restrictions': { score:50, label:'Regular', tier:'bronze' },
    'Does Not Meet': { score:25, label:'Bad', tier:'review' }
  };
  const financialBySupplierId = new Map(
    Object.entries(financialAssessments || {}).map(([id,value])=>[String(id).trim(),value])
  );
  const all = [...supplierRegistrationById.entries()].map(([supplierId,registration]) => {
    const financial=financialBySupplierId.get(supplierId);
    const result=financial && financialScoreByStatus[financial.status];
    const overall=result ? result.score : null;
    return {
      supplierId,
      registration,
      name:registration.fantasyName||registration.name||supplierId,
      contracts:1,
      overall,
      tier:result ? result.tier : 'none',
      financialOverallStatus:result ? result.label : 'Under Review',
      financialRawStatus:financial ? financial.status : '',
      criteria:{ financial:overall },
      leadAgreedAvg:null, leadActualAvg:null, onTime:0, onTimeBase:0,
      priceVarPct:null, fillRate:null, volAgreedSum:0, volActualSum:0
    };
  }).sort((a,b)=>(isNum(b.overall)?b.overall:-1)-(isNum(a.overall)?a.overall:-1));
  const warrantyBySupplier = new Map();
  state.warranty.forEach(w => { if (!warrantyBySupplier.has(w.supplierId)) warrantyBySupplier.set(w.supplierId, []); warrantyBySupplier.get(w.supplierId).push(w); });
  const counts = { gold: 0, silver: 0, bronze: 0, review: 0, none: 0 };
  all.forEach(s => counts[s.tier]++);
  const sups = state.dash.tier === 'all' ? all : all.filter(s => s.tier === state.dash.tier);

  if (!all.length) {
    $('#view').innerHTML = '<div class="panel empty">No data yet. Add suppliers in the <b>Supplier Registration</b> tab or import records in <b>Settings</b>.</div>'; return;
  }

  // KPIs
  const scored = sups.filter(s => isNum(s.overall));
  const avgScore = scored.length ? mean(scored.map(s => s.overall)) : null;
  const otBase = sum(sups.map(s => s.onTimeBase)), otOk = sum(sups.map(s => s.onTime));
  const pv = sups.filter(s => isNum(s.priceVarPct)), avgPv = pv.length ? mean(pv.map(s => s.priceVarPct)) : null;
  const vA = sum(sups.map(s => s.volAgreedSum)), vR = sum(sups.map(s => s.volActualSum));
  const cases = sum(sups.map(s => sum((warrantyBySupplier.get(s.supplierId) || []).map(w => w.cases))));
  const top = scored[0];
  const cards = `
    <section class="cards">
      <div class="card"><div class="ico i1">${ICON.people}</div><div><div class="lbl">Suppliers</div><div class="val">${sups.length}</div><div class="sub">${sum(sups.map(s => s.contracts))} contracts</div></div></div>
      <div class="card"><div class="ico i5">${ICON.trophy}</div><div><div class="lbl">Average overall score</div><div class="val">${fmt.score(avgScore)}<span class="muted" style="font-size:13px"> / 100</span></div><div class="sub">${top ? 'Top: ' + esc(top.name) : '&nbsp;'}</div></div></div>
      <div class="card"><div class="ico i2">${ICON.clock}</div><div><div class="lbl">On-time contracts</div><div class="val">${otBase ? fmt.pct(otOk / otBase * 100, 0) : '—'}</div><div class="sub">${otOk} of ${otBase} on or before lead time</div></div></div>
      <div class="card"><div class="ico i3">${ICON.price}</div><div><div class="lbl">Average price variance</div><div class="val">${fmt.spct(avgPv)}</div><div class="sub">vs. agreed price</div></div></div>
      <div class="card"><div class="ico i4">${ICON.box}</div><div><div class="lbl">Volume fill rate</div><div class="val">${vA ? fmt.pct(vR / vA * 100, 1) : '—'}</div><div class="sub">${fmt.int(vR)} of ${fmt.int(vA)} units</div></div></div>
      <div class="card"><div class="ico i6">${ICON.shield}</div><div><div class="lbl">Warranty cases</div><div class="val">${fmt.int(cases)}</div><div class="sub">total across suppliers</div></div></div>
    </section>`;

  // Tier filter
  const chip = (k, label, n) => `<button class="fchip ${state.dash.tier === k ? 'on' : ''}" data-tier="${k}">${label}<span class="n">${n}</span></button>`;
  const filter = `<div class="toolbar"><div class="chips">${chip('all', 'All', all.length)}${['gold', 'silver', 'bronze', 'review'].map(k => chip(k, TIERS[k].label, counts[k])).join('')}</div></div>`;

  if (!sups.length) { $('#view').innerHTML = filter + cards + '<div class="panel empty">No suppliers in this tier.</div>'; return; }

  // Top 5 podium with department-level status tooltip
  const topFive = scored.slice(0,5);
  const financialLabel = status => ({
    'Meets Without Restrictions':'Excellent', 'Meets':'Good',
    'Meets With Restrictions':'Regular', 'Does Not Meet':'Bad'
  })[status] || 'Under Review';
  const podiumOrder = topFive.length >= 3 ? [topFive[1],topFive[0],topFive[2],...topFive.slice(3)] : topFive;
  const board = `<div class="supplier-podium">${podiumOrder.map(s => {
    const rank=topFive.findIndex(x=>x.supplierId===s.supplierId)+1;
    const rec=s.registration || supplierRegistrationById.get(s.supplierId);
    const finStatus=s.financialOverallStatus || 'Under Review';
    return `<article class="podium-card podium-rank-${rank}" style="--tier-bg:${TIERS[s.tier].bg};--tier-ink:${TIERS[s.tier].ink}">
      <div class="podium-medal">${rank}</div>
      <div class="podium-name">${esc((rec&&rec.fantasyName)||s.name)}${newBadge(rec)}</div>
      <div class="podium-score">${fmt.score(s.overall)}<small>/100</small></div><div class="podium-source">Financial Assessment</div>
      <div class="podium-tier">${tierBadge(s.tier)}</div>
      <div class="podium-tooltip"><strong>Department Status</strong><div><span>Financial Assessment</span><b>${esc(finStatus)}</b></div><div class="future-dept"><span>Purchase</span><b>Coming soon</b></div><div class="future-dept"><span>Development</span><b>Coming soon</b></div><div class="future-dept"><span>Quality</span><b>Coming soon</b></div></div>
    </article>`;
  }).join('')}</div>`;

  // Heatmap
  const heat = `<div class="heat-wrap"><table class="heat"><thead><tr><th>Supplier</th>${CRITERIA.map(c => `<th>${c.label}</th>`).join('')}<th>Overall</th><th>Tier</th></tr></thead><tbody>` +
    sups.map(s => `<tr><td>${esc(s.name)}</td>${CRITERIA.map(c => { const v = s.criteria[c.key]; return `<td style="${isNum(v) ? scoreStyle(v) : 'background:var(--bg);color:var(--text-soft)'}">${fmt.score(v)}</td>`; }).join('')}<td style="${isNum(s.overall) ? scoreStyle(s.overall) : ''};box-shadow:inset 0 0 0 1.5px rgba(80,70,120,.18)">${fmt.score(s.overall)}</td><td style="background:${TIERS[s.tier].bg};color:${TIERS[s.tier].ink}">${TIERS[s.tier].label}</td></tr>`).join('') +
    '</tbody></table></div>';

  // Radar selection
  state.dash.radar = state.dash.radar.filter(id => sups.some(s => s.supplierId === id));
  if (!state.dash.radar.length) state.dash.radar = sups.slice(0, 3).map(s => s.supplierId);
  const picked = state.dash.radar.map(id => sups.find(s => s.supplierId === id)).filter(Boolean);
  const radarPanel = `
    <div class="radar-chips">${sups.map(s => `<button class="fchip ${state.dash.radar.includes(s.supplierId) ? 'on' : ''}" data-radar="${esc(s.supplierId)}">${esc(s.name)}</button>`).join('')}</div>
    ${radar(picked)}
    <div class="radar-legend">${picked.map((s, k) => `<span><i style="background:${RADAR_COLORS[k % 4]}"></i>${esc(s.name)}</span>`).join('')}</div>`;

  // Lead time (agreed vs actual)
  const ltItems = sups.filter(s => isNum(s.leadAgreedAvg));
  const ltMax = Math.max(1, ...ltItems.flatMap(s => [s.leadAgreedAvg, s.leadActualAvg]));
  const leadChart = `<div class="legend"><span><i style="background:#d9d6ea"></i>Agreed</span><span><i style="background:#8fd0b0"></i>Actual (on time)</span><span><i style="background:#eeb0b0"></i>Actual (late)</span></div>` +
    ltItems.map(s => { const late = s.leadActualAvg > s.leadAgreedAvg, d = s.leadActualAvg - s.leadAgreedAvg;
      return `<div class="brow"><div class="bl" title="${esc(s.name)}">${esc(s.name)}</div><div class="stack">
        <div class="bar" style="width:${s.leadAgreedAvg / ltMax * 100}%;background:#d9d6ea"></div>
        <div class="bar" style="width:${s.leadActualAvg / ltMax * 100}%;background:${late ? '#eeb0b0' : '#8fd0b0'}"></div></div>
        <div class="bv">${fmt.int(s.leadAgreedAvg)} → ${fmt.int(s.leadActualAvg)} d<br>${d === 0 ? 'on time' : (d > 0 ? '+' : '−') + fmt.int(Math.abs(d)) + ' d'}</div></div>`; }).join('');

  // Price variance (diverging)
  const pvItems = sups.filter(s => isNum(s.priceVarPct));
  const pvMax = Math.max(5, ...pvItems.map(s => Math.abs(s.priceVarPct)));
  const priceChart = `<div class="legend"><span><i style="background:#8fd0b0"></i>Below agreed</span><span><i style="background:#eeb0b0"></i>Above agreed</span></div>` +
    pvItems.map(s => { const v = s.priceVarPct, w = Math.abs(v) / pvMax * 50;
      return `<div class="brow"><div class="bl" title="${esc(s.name)}">${esc(s.name)}</div><div class="div-track"><i class="zero"></i><b class="seg ${v >= 0 ? 'pos' : 'neg'}" style="width:${w}%;background:${v > 0 ? '#eeb0b0' : '#8fd0b0'}"></b></div><div class="bv">${fmt.spct(v)}</div></div>`; }).join('');

  // Volume fill rate
  const vlItems = sups.filter(s => isNum(s.fillRate)), vlMax = Math.max(120, ...vlItems.map(s => s.fillRate));
  const volChart = `<div class="legend"><span><i style="background:#8fd0b0"></i>≥ 100%</span><span><i style="background:#f3d98f"></i>90–99%</span><span><i style="background:#eeb0b0"></i>&lt; 90%</span></div>` +
    vlItems.map(s => { const col = s.fillRate >= 100 ? '#8fd0b0' : s.fillRate >= 90 ? '#f3d98f' : '#eeb0b0';
      return `<div class="brow"><div class="bl" title="${esc(s.name)}">${esc(s.name)}</div><div class="div-track" style="height:10px"><i class="mark" style="left:${100 / vlMax * 100}%"></i><b class="seg" style="left:0;width:${s.fillRate / vlMax * 100}%;background:${col};border-radius:999px"></b></div><div class="bv">${fmt.pct(s.fillRate, 1)}</div></div>`; }).join('');

  // Warranty
  const warrantyItems = sups.map(s => ({ ...s, warrantyLines: warrantyBySupplier.get(s.supplierId) || [] })).map(s => ({ ...s, warrantyTotal: sum(s.warrantyLines.map(w => w.cases)), detractors: s.warrantyLines.slice().sort((a,b) => b.cases - a.cases).slice(0,2) }));
  const wcMax = Math.max(1, ...warrantyItems.map(s => s.warrantyTotal));
  const warChart = warrantyItems.slice().sort((a, b) => b.warrantyTotal - a.warrantyTotal).map(s =>
    `<div class="brow"><div class="bl" title="${esc(s.name)}">${esc(s.name)}</div><div class="stack"><div class="track"><i style="width:${s.warrantyTotal / wcMax * 100}%;background:#f0b8c2"></i></div><div class="sub" style="font-size:11px">${s.detractors.length ? 'Detractors: ' + s.detractors.map(w => esc(w.partNumber) + ' (' + w.cases + ')').join(' · ') : 'No warranty cases'}</div></div><div class="bv">${s.warrantyTotal} case${s.warrantyTotal === 1 ? '' : 's'}</div></div>`).join('');

  $('#view').innerHTML = filter + `<div class="dashboard-theme-title"><span></span><h2>Overall Score</h2><span></span></div>` + cards + `
    <div class="grid g-2-1 ranking-grid">
      <div class="panel ranking-panel"><div class="panel-title-centered"><h3>Supplier Ranking</h3><p class="desc">Top 5 suppliers ranked by Overall Score, while retaining the Gold, Silver, Bronze and Under Review classification.</p></div>${board}</div>
      <div class="panel"><h3>Tier distribution</h3><p class="desc">All suppliers, regardless of the filter above</p>${donut(counts)}</div>

      <div class="panel"><h3>Volume fill rate</h3><p class="desc">Delivered ÷ agreed volume (marker = 100%)</p>${volChart || '<div class="empty">No data</div>'}</div>
      <div class="panel"><h3>Warranty comparison</h3><p class="desc">Cases by supplier and the part numbers with the most reported issues.</p>${warChart}</div>
    </div>`;
}

function blankRecord() {

  r.id = 'new-' + uid(); r._new = true; return r;

async function saveRow(tr) {
  const id = tr.dataset.k, idx = state.records.findIndex(r => r.id === id); if (idx < 0) return;
  const v = readRow(tr);
  if (!v.supplierId) { toast('Enter the supplier ID.'); $('[data-f=supplierId]', tr).focus(); return; }
  if (!v.name) { toast('Enter the supplier name.'); $('[data-f=name]', tr).focus(); return; }
  if (v.taxId && !isValidCnpj(v.taxId)) { toast('Enter a valid CNPJ in the format 00.000.000/0000-00.'); $('[data-f=taxId]', tr).focus(); return; }
  v.taxId = formatCnpj(v.taxId);
  const rec = normalizeRecord(Object.assign({}, v, { id: state.records[idx]._new ? undefined : id }));
  try {
    const saved = state.records[idx]._new ? await store.create(rec) : await store.update(id, rec);
    state.sup.editing.delete(id);
    state.records[idx] = normalizeRecord(saved);
    // keep supplier master data consistent across all contracts of the same ID
    renderSuppliersBody(); toast('Row saved.');
  } catch (e) { setSupplierSync('error','Supabase error'); toast('Could not save to Supabase: ' + e.message); }
}

function cancelRow(id) {

  }
});

function makeXlsxWorkbook(sheets) {

/* Brazilian CNPJ formatting and validation for Supplier Registration. */
function formatCnpj(value) {
  const digits=String(value ?? '').replace(/\D/g,'').slice(0,14);
  return digits.replace(/^(\d{2})(\d)/,'$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/,'$1.$2.$3').replace(/\.(\d{3})(\d)/,'.$1/$2').replace(/(\/\d{4})(\d)/,'$1-$2');
}
function isValidCnpj(value) {
  const digits=String(value ?? '').replace(/\D/g,'');
  if(digits.length!==14 || /^(\d)\1{13}$/.test(digits)) return false;
  const digit=len=>{ let sum=0,pos=len-7; for(let i=len;i>=1;i--){sum+=Number(digits[len-i])*pos--; if(pos<2)pos=9;} const mod=sum%11; return mod<2?0:11-mod; };
  return digit(12)===Number(digits[12]) && digit(13)===Number(digits[13]);
}

  if (!rfqDetails[id].rows.length) rfqDetails[id].rows.push(newRfqLine());
  return rfqDetails[id];
};
const rfqCols = ['F1-A00-0','F2-A00-1','V1-A00-2','V2','E2'];

function rfqExpandedRow(r) {
  const record = rfqRecord(r.id);
  const lineHtml = d => {
    const fileCell = code => { const f=d.files[code]; return `<td class="rfq-file-cell"><label class="rfq-upload"><input type="file" accept="application/pdf,.pdf" data-rfq-file="${esc(code)}" data-rfq-row="${esc(d.id)}"><span>${f ? esc(f.name) : 'Upload PDF'}</span></label>${f?`<button class="rfq-clear" data-rfq-clear="${esc(code)}" data-rfq-row="${esc(d.id)}" title="Remove file">×</button>`:''}</td>`; };
    return `<tr data-rfq-row-id="${esc(d.id)}"><td><input data-rfq-field="project" data-rfq-row="${esc(d.id)}" value="${esc(d.project)}" placeholder="Project"></td><td><input data-rfq-field="product" data-rfq-row="${esc(d.id)}" value="${esc(d.product||'')}" placeholder="Product"></td><td><input data-rfq-field="partNumber" data-rfq-row="${esc(d.id)}" value="${esc(d.partNumber)}" placeholder="Part Number"></td><td><input data-rfq-field="partName" data-rfq-row="${esc(d.id)}" value="${esc(d.partName)}" placeholder="Part Name"></td>${rfqCols.map(fileCell).join('')}<td><button class="icon-btn del rfq-delete-row" data-rfq-delete-row="${esc(d.id)}" title="Delete RFQ row">${ICON.del}</button></td></tr>`;
  };
  return `<tr class="supplier-detail-row" data-detail-for="${esc(r.id)}" hidden><td colspan="12"><div class="supplier-detail-card"><div class="rfq-section-head"><div class="rfq-section-title">RFQ</div></div><div class="rfq-table-wrap"><table class="rfq-detail-table"><thead><tr><th>Project</th><th>Product</th><th>Part Number</th><th>Part Name</th>${rfqCols.map(c=>`<th>${c}</th>`).join('')}<th>Actions</th></tr></thead><tbody>${record.rows.map(lineHtml).join('')}</tbody></table><button class="rfq-add-row" data-rfq-add-row="${esc(r.id)}">${ICON.plus}<span>Add row</span></button></div></div></td></tr>`;

/* Financial Assessment, linked to Supplier Registration by Supplier ID */
const FINANCIAL_STORAGE_KEY = 'supplierManagement.financialAssessment.v1';
let financialAssessments = (() => { try { return JSON.parse(localStorage.getItem(FINANCIAL_STORAGE_KEY) || '{}'); } catch { return {}; } })();
const saveFinancialAssessments = () => localStorage.setItem(FINANCIAL_STORAGE_KEY, JSON.stringify(financialAssessments));
const financialDefaults = () => ({ source:'Serasa', negativeEquity:'No', fgts:'OK', federalRevenue:'OK', serasaIssues:0, assessmentDate:'', balanceAssessed:'', score:0, status:'Meets Without Restrictions', followUp:'Annual' });
function financialRecord(supplierId) { return financialAssessments[supplierId] || (financialAssessments[supplierId] = financialDefaults()); }
const financialSelect = (field, value, options, supplierId) => `<select data-fin-field="${field}" data-supplier-id="${esc(supplierId)}">${options.map(([v,l])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(l)}</option>`).join('')}</select>`;

function financialStatusClass(status) {
  return ({
    'Meets Without Restrictions':'fin-status-green',
    'Meets':'fin-status-light-green',
    'Meets With Restrictions':'fin-status-yellow',
    'Does Not Meet':'fin-status-red'
  })[status] || '';
}

function financialOverallResult(status) {
  return ({
    'Meets Without Restrictions': { label:'Excellent', score:100 },
    'Meets': { label:'Good', score:75 },
    'Meets With Restrictions': { label:'Regular', score:50 },
    'Does Not Meet': { label:'Bad', score:25 }
  })[status] || { label:'', score:0 };
}

function renderFinancialAssessment() {
  const suppliers = state.records.map(normalizeRecord).filter(r => r.supplierId).sort((a,b)=>a.supplierId.localeCompare(b.supplierId));
  const rows = suppliers.map(r => {
    const f=financialRecord(r.supplierId), statusClass=financialStatusClass(f.status), overall=financialOverallResult(f.status);
    return `<tr data-supplier-id="${esc(r.supplierId)}"><td><span class="sid">${esc(r.supplierId)}</span></td><td class="financial-supplier">${esc(r.fantasyName || r.name)}</td>
      <td>${financialSelect('source',f.source,[['Serasa','Serasa'],['Supplier','Fornecedor']],r.supplierId)}</td>
      <td>${financialSelect('negativeEquity',f.negativeEquity,[['No','Não'],['Yes','Sim']],r.supplierId)}</td>
      <td>${financialSelect('fgts',f.fgts,[['OK','OK'],['NG','NG']],r.supplierId)}</td>
      <td>${financialSelect('federalRevenue',f.federalRevenue,[['OK','OK'],['NG','NG']],r.supplierId)}</td>
      <td><input type="number" min="0" step="1" data-fin-field="serasaIssues" data-supplier-id="${esc(r.supplierId)}" value="${esc(f.serasaIssues)}"></td>
      <td><input type="date" data-fin-field="assessmentDate" data-supplier-id="${esc(r.supplierId)}" value="${esc(f.assessmentDate)}"></td>
      <td><input type="date" data-fin-field="balanceAssessed" data-supplier-id="${esc(r.supplierId)}" value="${esc(f.balanceAssessed)}"></td>
      <td class="fin-score-cell ${statusClass}"><input type="number" step="1" data-fin-field="score" data-supplier-id="${esc(r.supplierId)}" value="${esc(f.score)}"></td>
      <td class="fin-status-cell ${statusClass}">${financialSelect('status',f.status,[['Meets Without Restrictions','Atende Sem Restrições'],['Meets','Atende'],['Meets With Restrictions','Atende Com Restrições'],['Does Not Meet','Não Atende']],r.supplierId)}</td>
      <td>${financialSelect('followUp',f.followUp,[['Annual','Anual'],['Quarterly','Trimestral'],['Monthly','Mensal']],r.supplierId)}</td>
      <td class="fin-overall-score ${statusClass}" data-overall-score="${overall.score}">${overall.score}</td>
      <td class="fin-overall-cell ${statusClass}"><span class="fin-overall-badge">${esc(overall.label)}</span></td></tr>`;
  }).join('');
  $('#view').innerHTML = `<div class="panel table-panel"><div class="table-wrap"><table class="data financial-table"><thead><tr><th>Supplier ID</th><th>Fantasy Name</th><th>Source</th><th>Negative Equity</th><th>FGTS</th><th>Federal Revenue</th><th>Serasa Issue Count</th><th>Assessment Date</th><th>Balance Assessed</th><th>Score</th><th>Status</th><th>Follow-up</th><th class="fin-overall-score-header">Overall Score</th><th class="fin-overall-header">Overall Status</th></tr></thead><tbody>${rows || '<tr><td colspan="14" class="empty">No suppliers registered.</td></tr>'}</tbody></table></div></div>`;
}

document.addEventListener('change', e => {
  const el=e.target.closest('[data-fin-field]'); if(!el) return;
  const supplierId=el.dataset.supplierId, field=el.dataset.finField, rec=financialRecord(supplierId);
  rec[field]=(el.type==='number' ? Number(el.value || 0) : el.value); saveFinancialAssessments();
  if (field === 'status') {
    const row = el.closest('tr');
    const statusCell = row && row.querySelector('.fin-status-cell');
    const scoreCell = row && row.querySelector('.fin-score-cell');
    const overallCell = row && row.querySelector('.fin-overall-cell');
    const overallScoreCell = row && row.querySelector('.fin-overall-score');
    const overallBadge = row && row.querySelector('.fin-overall-badge');
    const overallResult = financialOverallResult(el.value);
    if (overallBadge) overallBadge.textContent = overallResult.label;
    if (overallScoreCell) {
      overallScoreCell.textContent = overallResult.score;
      overallScoreCell.dataset.overallScore = overallResult.score;
    }
    const statusClasses = ['fin-status-green','fin-status-light-green','fin-status-yellow','fin-status-red'];
    const nextClass = financialStatusClass(el.value);
    [statusCell, scoreCell, overallScoreCell, overallCell].filter(Boolean).forEach(cell => {
      cell.classList.remove(...statusClasses);
      if (nextClass) cell.classList.add(nextClass);
    });
  }
  toast('Financial assessment saved.');
});


/* Sortable Supplier Registration and Financial Assessment tables */
const tableSortState = {
  supplier: { column: -1, direction: 'asc' },
  financial: { column: -1, direction: 'asc' }
};
function sortCellValue(cell) {
  if (!cell) return '';
  const control = cell.querySelector('select,input');
  const raw = control ? control.value : cell.textContent;
  const value = String(raw ?? '').trim();
  if (control && control.type === 'number') return Number(value || 0);
  if (/^-?\d+(?:[.,]\d+)?$/.test(value)) return Number(value.replace(',','.'));
  return value.toLocaleLowerCase('pt-BR');
}
function compareSortValues(a,b,direction) {
  let result;
  if (typeof a === 'number' && typeof b === 'number') result = a-b;
  else result = String(a).localeCompare(String(b),'pt-BR',{numeric:true,sensitivity:'base'});
  return direction === 'asc' ? result : -result;
}
function decorateSortableHeaders(table, type) {
  if (!table) return;
  const headers = [...table.querySelectorAll('thead tr:last-child th')];
  headers.forEach((th,index) => {
    if (type === 'supplier' && index === headers.length-1) return;
    th.classList.add('sortable-header'); th.dataset.sortType=type; th.dataset.sortColumn=index;
    th.tabIndex=0; th.setAttribute('role','button'); th.setAttribute('aria-label',`Sort by ${th.textContent.trim()}`);
  });
  updateSortIndicators(table,type);
}
function updateSortIndicators(table,type) {
  const active=tableSortState[type];
  table.querySelectorAll('.sortable-header').forEach(th => {
    const on=Number(th.dataset.sortColumn)===active.column;
    th.classList.toggle('sort-active',on);
    th.dataset.sortDirection=on ? active.direction : '';
    th.setAttribute('aria-sort',on ? (active.direction==='asc'?'ascending':'descending') : 'none');
  });
}
function sortSupplierTable() {
  const table=document.querySelector('table.supplier-registration'); if(!table) return;
  decorateSortableHeaders(table,'supplier');
  const cfg=tableSortState.supplier; if(cfg.column<0) return;
  const tbody=table.tBodies[0];
  const groups=[];
  [...tbody.children].forEach(row => {
    if(row.classList.contains('supplier-main-row') || row.classList.contains('editing')) groups.push([row]);
    else if(row.classList.contains('supplier-detail-row') && groups.length) groups[groups.length-1].push(row);
    else groups.push([row]);
  });
  groups.sort((a,b)=>compareSortValues(sortCellValue(a[0].cells[cfg.column]),sortCellValue(b[0].cells[cfg.column]),cfg.direction));
  const frag=document.createDocumentFragment(); groups.forEach(group=>group.forEach(row=>frag.appendChild(row))); tbody.appendChild(frag);
  updateSortIndicators(table,'supplier');
}
function sortFinancialTable() {
  const table=document.querySelector('table.financial-table'); if(!table) return;
  decorateSortableHeaders(table,'financial');
  const cfg=tableSortState.financial; if(cfg.column<0) return;
  const tbody=table.tBodies[0]; const rows=[...tbody.rows];
  rows.sort((a,b)=>compareSortValues(sortCellValue(a.cells[cfg.column]),sortCellValue(b.cells[cfg.column]),cfg.direction));
  const frag=document.createDocumentFragment(); rows.forEach(row=>frag.appendChild(row)); tbody.appendChild(frag);
  updateSortIndicators(table,'financial');
}
const _renderSuppliersBodySortable=renderSuppliersBody;
renderSuppliersBody=function(){ _renderSuppliersBodySortable(); sortSupplierTable(); };
const _renderFinancialAssessmentSortable=renderFinancialAssessment;
renderFinancialAssessment=function(){ _renderFinancialAssessmentSortable(); sortFinancialTable(); };
const financialAssessmentTabSortable=TABS.find(t=>t.id==='financial-assessment');
if(financialAssessmentTabSortable) financialAssessmentTabSortable.render=renderFinancialAssessment;
const supplierRegistrationTabSortable=TABS.find(t=>t.id==='supplier-registration');
if(supplierRegistrationTabSortable) supplierRegistrationTabSortable.render=renderSuppliers;
function activateTableSort(header) {
  const type=header.dataset.sortType, column=Number(header.dataset.sortColumn), cfg=tableSortState[type];
  cfg.direction=cfg.column===column && cfg.direction==='asc' ? 'desc' : 'asc'; cfg.column=column;
  if(type==='supplier') sortSupplierTable(); else sortFinancialTable();
}
document.addEventListener('click',e=>{ const th=e.target.closest('.sortable-header'); if(th) activateTableSort(th); });
document.addEventListener('keydown',e=>{ const th=e.target.closest('.sortable-header'); if(th && (e.key==='Enter'||e.key===' ')){e.preventDefault();activateTableSort(th);} });


function setSupplierSync(status,text){
  const pill=document.getElementById('supplierSync'); if(!pill) return;
  pill.classList.remove('online','error'); if(status) pill.classList.add(status);
  const label=pill.querySelector('span'); if(label) label.textContent=text;
}

  try {
    const [rows, settings] = await Promise.all([store.list(), store.getSettings()]);

  const h = (location.hash || '').replace('#', '');
  state.tab = TABS.some(t => t.id === h) ? h : 'dashboard';

})();
